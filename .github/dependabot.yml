# Dependabot configuration (card A-03, PRD §12.5).
# Weekly update PRs for JS dependencies and GitHub Actions versions.

version: 2
updates:
  # npm dependencies (package.json / package-lock.json).
  # Version-update PRs wait 14 days after a release (CLAUDE.md soak rule);
  # security updates are unaffected by cooldown.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  # GitHub Actions used by .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

# BINZI continuous integration (card A-03).
#
# One job with a stable name ("ci") so branch protection can reference it as
# a required status check (H-01). Runs on every PR and on pushes to main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save Actions minutes on
# this private repo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node version as local development (from A-01).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts and .next/ are gitignored, so a clean checkout has no
      # Next.js type definitions yet. `next typegen` is the official Next.js
      # command (verified against the bundled docs of the installed version)
      # that generates them before `tsc --noEmit` runs.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails on hex color literals outside src/styles/tokens.css and the
      # hero illustration assets (card A-04).
      - name: Lint hex
        run: npm run lint:hex

      - name: Test
        run: npm run test

      # Safe dummy values, scoped to the build step only — just enough for the
      # Zod env validation that instrumentation.ts runs during `next build`,
      # plus the presence check in src/db/index.ts: since A-14b, /belajar is
      # the first route importing the db module, so `next build` evaluates it
      # while collecting page data. /belajar is dynamic (ƒ) — nothing connects
      # to the dummy URL. Never real secrets. Kept off the other steps on
      # purpose: the env tests from A-02 assert behavior when MAIL_TRANSPORT
      # is *absent*, so the test step must run with a clean environment.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          MAIL_TRANSPORT: log
          DATABASE_URL: postgresql://ci:ci@localhost:6543/ci

      # npm audit with documented, expiring exceptions; entries may carry
      # a soak window and expiry (scripts/check-audit.mjs).
      - name: Audit dependencies
        run: node scripts/check-audit.mjs

  # E2E harness (card A-19): real Chromium against a PRODUCTION build served
  # by webServer.command, on a throwaway Postgres that the harness resets
  # every run. Runs in parallel with `ci` under a stable job name so branch
  # protection can require it (the H-01 pattern).
  #
  # NO secrets.* anywhere (public repo): every server value is the explicit
  # dummy/Cloudflare-test env from e2e/env.ts, and PRs from forks/Dependabot
  # cannot leak anything they do not have.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same image as the local `binzi-e2e-db` container (A-19: same major
        # as binzi-dev, pinned minor tag) — the harness drops/recreates the
        # schema inside this service container every run.
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: binzi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # webServer.command does db-setup (drop → migrate → seed against
      # E2E_DATABASE_URL below) → next build → next start on :3100.
      - name: Run E2E tests
        run: npm run e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/binzi_e2e

      # Reports only on failure, 7-day retention (card A-19 §5). Artifacts
      # contain no secrets — the E2E env is all dummy/test values.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

